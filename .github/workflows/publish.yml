name: Publish to pub.dev

# Triggered by tag pushes on `main` matching the single package's
# tag prefix. Tags are created by `release.yml` (workflow_dispatch).
# There is no auto-tag step; tags only exist when a human
# deliberately cuts one. This eliminates the orphan-tag drift class
# that plagued the previous auto-tag.yml flow.
#
# Uses the canonical
# `dart-lang/setup-dart/.github/workflows/publish.yml@v1` reusable
# workflow, which handles OIDC token exchange with pub.dev.

on:
  push:
    tags:
      - 'simple_sms_native-v*'

jobs:
  publish:
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      working-directory: .
