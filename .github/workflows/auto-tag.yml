name: Auto-tag on merge

# Runs when a PR merges to `main`. Computes the next version,
# commits the pubspec bump, and pushes a tag — which triggers
# publish.yml.
#
# simple-sms is single-package so there's one working dir and
# one tag prefix. The versioning rule (see auto-tag.yml in
# simple-permissions for the canonical write-up):
#
#   pubspec_version  = what the pubspec.yaml currently says
#   last_tag_version = max version across existing
#                      simple_sms_native-v<semver> tags
#   candidate        = last_tag_version with patch + 1
#                      (or 0.0.1 if no tags exist yet)
#   next_version     = max(pubspec_version, candidate)

on:
  push:
    branches: [main]

jobs:
  autotag:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    permissions:
      # `contents: write` — commit pubspec bump + push tag.
      # `actions:  write` — dispatch publish.yml via
      #   `gh workflow run` after the tag lands. Needed because
      #   GitHub suppresses `push: tags` workflow triggers when
      #   the pusher is the default GITHUB_TOKEN, so we wake
      #   publish.yml through `workflow_dispatch` instead.
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Compute + apply version bump
        run: |
          set -euo pipefail

          pkg="simple_sms_native"

          pubspec_v="$(grep '^version:' pubspec.yaml \
            | sed 's/version:[[:space:]]*//' | tr -d '\r')"

          last_tag="$(git tag --list "${pkg}-v*" \
            | sed "s/^${pkg}-v//" \
            | sort -V | tail -1 || true)"

          next_patch() {
            local v="$1"
            local base="${v%%-*}"
            IFS='.' read -r major minor patch <<< "$base"
            echo "${major}.${minor}.$((patch + 1))"
          }

          version_gt() {
            local a="${1%%-*}" b="${2%%-*}"
            [ "$(printf '%s\n%s\n' "$a" "$b" | sort -V | tail -1)" = "$a" ] \
              && [ "$a" != "$b" ]
          }

          if [ -z "$last_tag" ]; then
            candidate="$pubspec_v"
          else
            candidate="$(next_patch "$last_tag")"
          fi

          if version_gt "$pubspec_v" "$candidate"; then
            next="$pubspec_v"
          else
            next="$candidate"
          fi

          echo "::notice::$pkg pubspec=$pubspec_v last_tag=${last_tag:-<none>} next=$next"

          if [ "$pubspec_v" != "$next" ]; then
            sed -i -E "s/^version:[[:space:]]*.*$/version: $next/" pubspec.yaml
            git add pubspec.yaml
            git commit -m "chore(release): auto-bump pubspec to $next [skip ci]"
          fi

          tag="${pkg}-v${next}"
          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "::notice::tag $tag already exists — skipping"
          else
            git tag "$tag"
            git push --atomic origin HEAD "$tag"
            # Expose to the dispatch step below.
            echo "new_tag=$tag" >> "$GITHUB_ENV"
          fi

      - name: Dispatch publish workflow for new tag
        if: ${{ env.new_tag != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # `--ref "$new_tag"` runs publish.yml as if it were
          # triggered by that tag push, so the OIDC token's `ref`
          # claim is `refs/tags/<tag>`. pub.dev's automated-
          # publishing policy verifies that against the configured
          # tag pattern — without it the claim is
          # `refs/heads/main` and OIDC is silently rejected,
          # falling back to the interactive OAuth flow which hangs
          # the runner forever.
          echo "Dispatching publish.yml for $new_tag (ref=$new_tag)"
          gh workflow run publish.yml --ref "$new_tag" -f tag="$new_tag"
