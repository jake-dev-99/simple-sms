name: Deploy

# Deploys the tagged release to pub.dev. Tags are created by the
# "Cut Release" workflow (workflow_dispatch). There is no auto-tag
# step; tags only exist when a human deliberately cuts one. This
# eliminates the orphan-tag drift class that plagued the previous
# auto-tag flow.
#
# subosito/flutter-action + flutter pub publish --force
# --skip-validation. `--skip-validation` lets pub publish work for
# Flutter packages (skips resolution which trips on `sdk: flutter`);
# pub.dev's server still enforces version monotonicity, ownership,
# and OIDC binding.

on:
  push:
    tags:
      - 'simple_sms_native-v*'
  # Manual re-fire for an existing tag — e.g. transient pub.dev
  # outage swallowed the original tag-push run, or an OIDC config
  # was fixed and the publish needs to be retried against the same
  # tag.
  #
  # Caveat: workflow_dispatch's OIDC token claims `ref` as the
  # branch the workflow was launched from (typically `main`), not
  # the tag. pub.dev's automated-publishing binding validates the
  # `ref` claim against the configured tag pattern, so a manual
  # re-fire MAY be rejected at the OIDC handshake even though the
  # checkout step operates on the tag. If a re-fire fails with
  # OAuth-fallback, the path forward is to delete + re-cut the tag
  # via the "Cut Release" workflow rather than re-firing this manually.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re-)deploy (e.g. simple_sms_native-v0.1.0)'
        required: true
        type: string

jobs:
  # Resolve the effective tag name regardless of trigger:
  #   push:tags         → github.ref_name
  #   workflow_dispatch → inputs.tag
  resolve-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      ref: ${{ steps.resolve.outputs.ref }}
    steps:
      - name: Resolve tag
        id: resolve
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_GITHUB_REF_NAME: ${{ github.ref_name }}
          INPUT_EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$INPUT_EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
          else
            tag="$INPUT_GITHUB_REF_NAME"
          fi
          # Reject control characters (newlines, CR, etc.) outright.
          # An attacker-controlled workflow_dispatch tag value with
          # an embedded newline could append further key=value lines
          # to $GITHUB_OUTPUT and override the resolved ref the
          # checkout step uses. Belt-and-suspenders alongside the
          # full-shape regex below.
          if [[ "$tag" =~ [[:cntrl:]] ]]; then
            echo "::error::Tag input contains control characters; rejected."
            exit 1
          fi
          # Tag must match the package prefix AND a plausible version
          # suffix. Anchored at both ends.
          if ! [[ "$tag" =~ ^simple_sms_native-v[0-9A-Za-z._+-]+$ ]]; then
            echo "::error::Tag '$tag' does not match expected simple_sms_native-v<version> shape."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "ref=refs/tags/$tag" >> "$GITHUB_OUTPUT"
          echo "::notice::Resolved deploy tag: $tag"

  native-build:
    name: Native build + unit tests (pre-publish gate)
    needs: resolve-tag
    runs-on: ubuntu-latest
    permissions:
      contents: read  # checkout only; least-privilege to match resolve-tag/publish (zizmor)
    # The full native Android compile + JVM (Robolectric) unit tests —
    # the half of the codebase `flutter test` (Dart-only) never touches.
    # This deliberately runs ONLY here, at tag/deploy time, as a gate
    # before the package is published to pub.dev — never on every PR.
    # A throwaway APK build on every PR/push is pure CI cost for no
    # benefit; PRs get the lightweight analyze+test gate in verify.yml
    # instead. The full build belongs with an actual release. (Linear
    # UNFY-149 safety net; UNFY-153 NDK trim folded in below.)
    #
    # Must run through the *example app's* Gradle: a bare
    # `:simple_sms_native` Gradle invocation can't configure —
    # settings.gradle.kts requires `flutter.sdk` in local.properties,
    # and the sibling plugin modules (:simple_permissions_android,
    # :simple_query_android) resolve only via Flutter's plugin-loader,
    # applied in the app's settings, not the plugin's. So we let
    # `flutter build apk` inject the gitignored gradlew wrapper +
    # local.properties and compile the native side, then run the unit
    # tests against that already-configured build.
    steps:
      - name: Checkout simple-sms (tagged ref)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          ref: ${{ needs.resolve-tag.outputs.ref }}
          path: simple-sms

      # Sibling plugins below (simple-permissions, simple-query) are checked
      # out at `ref: main` — an ACCEPTED non-hermeticity tradeoff (UNFY-189),
      # captured here so it stays a deliberate decision rather than a silent
      # one. The job builds against the siblings' moving `main`, not a
      # coordinated revision, so a sibling push can flip this repo's CI with
      # no change here. Acknowledged when the native gate was scoped. If
      # sibling-drift flakiness becomes a real cost, tighten across all three
      # workflows (verify-native.yml / verify.yml / deploy.yml) to pinned
      # revisions (pubspec.lock / pubspec_overrides) or release tags.
      - name: Checkout simple-permissions (sibling dep)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          repository: jake-dev-99/simple-permissions
          ref: main
          path: simple-permissions

      - name: Checkout simple-query (sibling dep)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          repository: jake-dev-99/simple-query
          ref: main
          path: simple-query

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable

      - name: Set up JDK 21 (Temurin)
        # Provision JDK 21 explicitly instead of leaning on the runner's
        # preinstalled $JAVA_HOME_21_X64, which is brittle across runner
        # images. setup-java exports JAVA_HOME for the build + test steps
        # below. Version matches android/build.gradle.kts
        # (sourceCompatibility = VERSION_21).
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK packages (compileSdk 36 + build-tools)
        # cmdline-tools live under $ANDROID_HOME on the runner and are NOT
        # on PATH — invoke sdkmanager by absolute path. Feed a bounded
        # `printf` of license acceptances rather than `yes |`: under the
        # runner's `-o pipefail` shell, infinite `yes` dies by SIGPIPE
        # (141) when sdkmanager stops reading, which pipefail would surface
        # as a step failure even on a clean install.
        #
        # NDK is intentionally NOT installed here: android/build.gradle.kts
        # pins ndkVersion 28.2.13676358, which is preinstalled on the
        # ubuntu-latest image, so AGP uses it directly. The prior explicit
        # `ndk;30.0.14904198` install downloaded ~1GB of an NDK the build
        # never used (Linear UNFY-153).
        run: printf 'y\n%.0s' $(seq 50) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Resolve example app deps
        working-directory: simple-sms/example
        run: flutter pub get

      - name: Compile native side (debug APK)
        working-directory: simple-sms/example
        # JAVA_HOME comes from the setup-java step above (JDK 21, matching
        # android/build.gradle.kts sourceCompatibility = VERSION_21). This
        # step also injects the gradlew wrapper + local.properties consumed
        # by the unit-test step below.
        run: flutter build apk --debug

      - name: Run native JVM unit tests
        working-directory: simple-sms/example/android
        # --no-daemon: throwaway CI runner, a persistent Gradle daemon buys
        # nothing. --stacktrace: full trace on failure (fail-loud stance).
        run: ./gradlew :simple_sms_native:testDebugUnitTest --console=plain --no-daemon --stacktrace

  publish:
    # Gated on the native build: don't publish a version to pub.dev that
    # doesn't compile / fails its JVM unit tests.
    needs: [resolve-tag, native-build]
    permissions:
      id-token: write
      contents: read
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.resolve-tag.outputs.ref }}
          fetch-depth: 0  # full history for the ancestry check

      - name: Verify tag commit is on main
        # `on.push.tags` is not branch-scoped — a tag from any branch
        # would otherwise trigger publish. The "Cut Release" workflow
        # normally only tags from main, but verify independently.
        env:
          RESOLVED_TAG: ${{ needs.resolve-tag.outputs.tag }}
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Tag $RESOLVED_TAG does not point to a commit on origin/main. Aborting publish."
            exit 1
          fi

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable

      - name: Verify pubspec version matches tag
        env:
          RESOLVED_TAG: ${{ needs.resolve-tag.outputs.tag }}
        run: |
          expected="${RESOLVED_TAG#simple_sms_native-v}"
          actual="$(grep '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//')"
          if [ "$expected" != "$actual" ]; then
            echo "::error::Tag ${RESOLVED_TAG} does not match pubspec version ${actual} (expected ${expected})"
            exit 1
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Publish
        # `dart pub publish` (not `flutter pub publish`) — this is
        # dart-lang's canonical automated-publishing invocation. The
        # earlier `flutter pub` choice was because dart pub refuses to
        # resolve a Flutter-SDK-pinned package, but `--skip-validation`
        # skips the resolution step that throws. Going through dart pub
        # removes one layer of indirection between the OIDC env vars
        # (`ACTIONS_ID_TOKEN_REQUEST_*`, injected by `id-token: write`)
        # and the pub binary that uses them. 2-min cap so an OAuth
        # fallback fails fast instead of waiting on a prompt nobody
        # will answer.
        timeout-minutes: 2
        run: dart pub publish --force --skip-validation
