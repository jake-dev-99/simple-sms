name: CI

# Runs on every PR against the three promotion-flow branches
# (develop -> staging -> main). CD handles the merge + tag side.
#
# simple-sms has path-dep references to sibling plugin repos
# (simple-permissions for PermissionGuards, simple-query for
# ContentQuery) via pubspec_overrides.yaml. The override paths
# are relative (`../simple-permissions`, ...), so CI lays out
# the sibling checkouts alongside this repo under the workspace
# for `flutter pub get` to resolve.
#
# External GitHub Actions are pinned to a full commit SHA rather
# than a floating tag (`@v4`, `@v2`). Floating tags can be
# rewritten by the action's repo owner OR by a compromised
# maintainer account, silently swapping in malicious code mid-CI.
# The trailing `# v4.3.1` style comment shows the human-readable
# version the SHA corresponds to so contributors don't have to
# reverse-look-up the hash. Bump the pin (and the comment) in a
# dedicated PR. SonarQube rule `githubactions:S7637` enforces
# this gate.
on:
  pull_request:
    branches: [main]

jobs:
  analyze-and-test:
    name: Analyze + test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout simple-sms
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          path: simple-sms

      - name: Checkout simple-permissions (sibling dep)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: jake-dev-99/simple-permissions
          ref: main
          path: simple-permissions

      - name: Checkout simple-query (sibling dep)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: jake-dev-99/simple-query
          ref: main
          path: simple-query

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable

      - name: Install dependencies
        working-directory: simple-sms
        run: flutter pub get

      - name: Analyze
        working-directory: simple-sms
        # Warnings-as-errors is the default for `flutter
        # analyze`. The `invalid_dependency` warning on
        # path-overrides is expected pre-publish; drop
        # warning fatality so it doesn't block the gate.
        run: flutter analyze --no-fatal-warnings

      - name: Lint silent enum defaults
        working-directory: simple-sms
        run: ./scripts/lint_silent_defaults.sh

      - name: Lint silent catch bodies
        working-directory: simple-sms
        run: ./scripts/lint_silent_catches.sh

      - name: Run tests
        working-directory: simple-sms
        run: flutter test

      # Validate publishability at CI time so publish-blocking issues
      # (missing LICENSE, malformed pubspec, oversize files, missing
      # repository/issue_tracker URLs) surface before merge instead of
      # after a tag push. CD then publishes with --skip-validation so
      # the same checks aren't re-run on the publish runner where
      # `pubspec_overrides.yaml` hints would otherwise clutter the log
      # and an interactive OAuth flow could stall the job.
      #
      # `--dry-run` exits 0 even when pub emits hints (the in-flight
      # `pubspec_overrides.yaml` warning during pre-publish dev) so it
      # doesn't falsely fail develop branches; only hard errors block.
      - name: Validate publishability (pub publish --dry-run)
        # 2-minute cap, matching the publish step in publish.yml. A
        # healthy `--dry-run` finishes in 10-30 s; anything longer
        # means pub is wedged on dependency resolution or a runaway
        # file walk. Fail fast rather than burn a runner.
        timeout-minutes: 2
        working-directory: simple-sms
        run: flutter pub publish --dry-run

