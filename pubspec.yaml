name: simple_sms_native
description: "A modern MMS / SMS plugin for Android"
version: 0.0.3
homepage: https://simplezen.io

environment:
  sdk: ^3.7.0
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  simple_query: ^0.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: ^5.0.0
  pigeon: ^26.0.1

flutter:
  plugin:
    platforms:
      dart:
        sdk: flutter
        pluginClass: SimpleSms
      android:
        package: io.simplezen.simple_sms
        pluginClass: SimpleSmsPlugin
