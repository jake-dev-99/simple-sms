name: simple_sms_native
description: "A modern MMS / SMS plugin for Android with typed inbound/outbound messaging, lookup service, and conversation enrichment. Runtime permissions + default-SMS-app role management are delegated to simple_permissions_native."
version: 0.4.3
homepage: https://simplezen.io
repository: https://github.com/simplezen/simple-sms
issue_tracker: https://github.com/simplezen/simple-sms/issues

topics:
  - sms
  - mms
  - messaging
  - android

environment:
  sdk: ^3.7.0
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  simple_query: ^0.3.0
  # simple_permissions_native owns the vocabulary for SMS-related
  # runtime permissions (ReceiveSms, ReadSms, SendSms, etc.) and the
  # default-SMS-app role (`DefaultSmsApp`). Any call on this plugin
  # that would surface as `SecurityException` without those grants
  # is a bug in the caller, not this plugin — docs on every such
  # method link back to the permission.
  simple_permissions_native: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: ^5.0.0
  pigeon: ^26.0.1

flutter:
  plugin:
    platforms:
      android:
        package: io.simplezen.simple_sms
        pluginClass: SimpleSmsPlugin
