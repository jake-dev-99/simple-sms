name: simple_sms_native
description: "A modern MMS / SMS plugin for Android with typed inbound/outbound messaging, lookup service, conversation enrichment, and default-app role management."
version: 0.2.0
homepage: https://simplezen.io
repository: https://github.com/simplezen/simple-sms
issue_tracker: https://github.com/simplezen/simple-sms/issues

topics:
  - sms
  - mms
  - messaging
  - android

environment:
  sdk: ^3.7.0
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  simple_query: ^0.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: ^5.0.0
  pigeon: ^26.0.1

flutter:
  plugin:
    platforms:
      android:
        package: io.simplezen.simple_sms
        pluginClass: SimpleSmsPlugin
